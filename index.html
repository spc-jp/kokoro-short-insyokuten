}

function CutListScreen({ purpose, videoLength, onBack, onStartShoot }) {
  const template = CUT_TEMPLATES[purpose.id][videoLength.seconds];
  const totalSeconds = template.cuts.reduce((sum, c) => sum + c.duration, 0);

  return (
    <div className="min-h-screen fade-in pb-12">
      <div className="text-white py-5 px-4 relative overflow-hidden" style={{background: 'linear-gradient(135deg, #E67E22 0%, #F39C12 100%)'}}>
        <div className="absolute inset-0 wood-pattern"></div>
        <div className="max-w-3xl mx-auto relative z-10">
          <button onClick={onBack} className="text-sm bg-white/25 hover:bg-white/40 px-3 py-1 rounded-full mb-3 transition">← 動画の長さを選び直す</button>
          <div className="flex items-center gap-3">
            <div className="text-3xl">{purpose.icon}</div>
            <div>
              <div className="text-xs opacity-90">{purpose.title}</div>
              <div className="text-xl font-bold">{videoLength.title}版（{template.cuts.length}カット）</div>
            </div>
          </div>
        </div>
      </div>

      <div className="max-w-3xl mx-auto px-4 py-6">
        <div className="text-center mb-6">
          <div className="inline-block bg-orange-100 text-orange-700 text-xs font-bold px-3 py-1 rounded-full mb-3">STEP 3 / 3</div>
          <h2 className="text-xl font-bold text-stone-800 mb-2">カット台本</h2>
          <p className="text-stone-600 text-sm">この順番で {template.cuts.length} 本撮影します（合計 {totalSeconds} 秒）</p>
        </div>

        <div className="mb-6">
          {template.cuts.map(cut => (
            <div key={cut.cutNo} className="cut-card">
              <div className="cut-number">
                <span style={{fontSize: '0.65rem', opacity: 0.9}}>CUT</span>
                <span className="cut-number-big">{cut.cutNo}</span>
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 mb-1.5">
                  <span className="scene-tag">{sceneInfo[cut.sceneId].icon} {sceneInfo[cut.sceneId].label}</span>
                  <span className="text-xs text-stone-500">⏱ {cut.duration}秒</span>
                </div>
                <div className="text-sm text-stone-800 leading-relaxed">{cut.instruction}</div>
              </div>
            </div>
          ))}
        </div>

        <div className="bg-amber-50 border-2 border-dashed border-orange-300 rounded-2xl p-5 text-center mb-4">
          <div className="text-4xl mb-2">🚧</div>
          <div className="font-bold text-stone-800 mb-2">連続撮影機能を準備中</div>
          <div className="text-xs text-stone-600 leading-relaxed mb-3">
            次のアップデート（STEP D）で、<br/>
            1カットずつガイド付きで撮影する機能を実装します。
          </div>
          <button onClick={onStartShoot} className="bg-stone-300 text-stone-500 font-bold px-6 py-2.5 rounded-full text-sm cursor-not-allowed" disabled>
            📹 連続撮影を始める（準備中）
          </button>
        </div>

        <div className="bg-white border border-orange-200 rounded-2xl p-4 text-xs text-stone-700 leading-relaxed">
          <div className="font-bold text-orange-700 mb-2">📋 STEP D で実装予定の機能</div>
          <div className="space-y-1">
            <div>▶ カット1から順番に撮影</div>
            <div>▶ 各カットごとに該当シーンのガイド表示</div>
            <div>▶ 撮影前のチェックリスト確認</div>
            <div>▶ 撮影後のプレビュー＆OK判定</div>
            <div>▶ 進捗バー（カット 1/{template.cuts.length} → {template.cuts.length}/{template.cuts.length}）</div>
          </div>
        </div>

        <div className="text-center mt-6">
          <button onClick={onBack} className="bg-white border-2 border-orange-300 text-orange-700 font-bold px-6 py-2 rounded-full hover:bg-orange-50 transition text-sm">
            別の長さも見てみる
          </button>
        </div>
      </div>
    </div>
  );
}

// ========== App ==========
function App() {
  const [screen, setScreen] = useState('top');
  const [selectedPurpose, setSelectedPurpose] = useState(null);
  const [selectedLength, setSelectedLength] = useState(null);

  const handleSelectPurpose = (p) => {
    setSelectedPurpose(p);
    setScreen('length');
    window.scrollTo(0, 0);
  };

  const handleSelectLength = (vl) => {
    setSelectedLength(vl);
    setScreen('cuts');
    window.scrollTo(0, 0);
  };

  const handleBackToTop = () => { setScreen('top'); window.scrollTo(0, 0); };
  const handleBackToLength = () => { setScreen('length'); window.scrollTo(0, 0); };
  const handleStartShoot = () => { /* STEP D で実装 */ };

  if (screen === 'top') return <TopScreen onSelectPurpose={handleSelectPurpose} />;
  if (screen === 'length') return <VideoLengthScreen purpose={selectedPurpose} onSelectLength={handleSelectLength} onBack={handleBackToTop} />;
  if (screen === 'cuts') return <CutListScreen purpose={selectedPurpose} videoLength={selectedLength} onBack={handleBackToLength} onStartShoot={handleStartShoot} />;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
