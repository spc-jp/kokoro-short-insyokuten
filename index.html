// ========== チェックリストモーダル ==========
function ChecklistModal({ scene, cut, checklistItems, onClose, onShoot }) {
  const [checkedItems, setCheckedItems] = useState([]);
  const toggleCheck = (i) => setCheckedItems(prev => prev.includes(i) ? prev.filter(x => x !== i) : [...prev, i]);
  const allChecked = checkedItems.length === checklistItems.length;

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-content" onClick={e => e.stopPropagation()}>
        <div className="text-center mb-4">
          <div className="text-4xl mb-2">{sceneInfo[scene].icon}</div>
          <div className="text-xs font-bold text-orange-600 mb-1">CUT {cut.cutNo}</div>
          <h3 className="text-lg font-bold text-stone-800">撮影前チェック</h3>
          <p className="text-xs text-stone-500 mt-1">{cut.instruction}</p>
        </div>

        <div className="mb-5">
          {checklistItems.map((item, i) => (
            <div key={i} className={`checklist-item ${checkedItems.includes(i) ? 'checked' : ''}`} onClick={() => toggleCheck(i)}>
              <div className="checklist-checkbox">{checkedItems.includes(i) ? '✓' : ''}</div>
              <div className="checklist-text">{item}</div>
            </div>
          ))}
        </div>

        <div className="text-center text-xs text-stone-500 mb-3">{checkedItems.length} / {checklistItems.length} 項目確認済み</div>

        <button onClick={onShoot} disabled={!allChecked} className="camera-btn-big">
          <span>📹</span>
          <span>{allChecked ? '準備OK！撮影する' : '全項目チェックしてください'}</span>
        </button>

        <button onClick={onClose} className="w-full mt-3 text-sm text-stone-500 py-2 hover:text-stone-700">あとで撮る</button>
      </div>
    </div>
  );
}

          </button>
          <p className="text-xs text-stone-500 mt-3 text-center leading-relaxed">
            ※スマホの標準カメラが起動します<br/>
            撮影した動画は端末に自動保存されます
          </p>
        </div>

        <div className="text-center mt-6">
          <button onClick={onBack} className="bg-white border-2 border-orange-300 text-orange-700 font-bold px-6 py-2 rounded-full hover:bg-orange-50 transition text-sm">
            別の長さも見てみる
          </button>
        </div>
      </div>
    </div>
  );
}

// ========== 連続撮影画面 ==========
function ShootingScreen({ purpose, videoLength, onComplete, onBack }) {
  const template = CUT_TEMPLATES[purpose.id][videoLength.seconds];
  const totalCuts = template.cuts.length;
  const [currentCutIndex, setCurrentCutIndex] = useState(0);
  const [recordedVideos, setRecordedVideos] = useState([]);
  const [showChecklist, setShowChecklist] = useState(false);
  const [previewVideoUrl, setPreviewVideoUrl] = useState(null);
  const fileInputRef = useRef(null);

  const currentCut = template.cuts[currentCutIndex];
  const sceneData = SCENE_DATA[currentCut.sceneId];

  const handleStartShoot = () => setShowChecklist(true);

  const handleConfirmShoot = () => {
    setShowChecklist(false);
    setTimeout(() => fileInputRef.current?.click(), 200);
  };

  const handleCapture = (e) => {
    const file = e.target.files[0];
    if (file) {
      const url = URL.createObjectURL(file);
      setPreviewVideoUrl(url);
    }
    e.target.value = '';
  };

  const handleAcceptVideo = () => {
    const newVideos = [...recordedVideos, { cutNo: currentCut.cutNo, url: previewVideoUrl, cut: currentCut }];
    setPreviewVideoUrl(null);

    if (currentCutIndex === totalCuts - 1) {
      onComplete(newVideos);
    } else {
      setRecordedVideos(newVideos);
      setCurrentCutIndex(currentCutIndex + 1);
      window.scrollTo(0, 0);
    }
  };

  const handleRetake = () => {
    if (previewVideoUrl) URL.revokeObjectURL(previewVideoUrl);
    setPreviewVideoUrl(null);
    setTimeout(() => fileInputRef.current?.click(), 200);
  };

  return (
    <div className="min-h-screen fade-in pb-12">
      <div className="text-white py-5 px-4 relative overflow-hidden sticky top-0 z-20" style={{background: 'linear-gradient(135deg, #E67E22 0%, #F39C12 100%)'}}>
        <div className="absolute inset-0 wood-pattern"></div>
        <div className="max-w-3xl mx-auto relative z-10">
          <button onClick={onBack} className="text-sm bg-white/25 hover:bg-white/40 px-3 py-1 rounded-full mb-2 transition">← カット台本に戻る</button>
          <div className="flex items-center justify-between">
            <div>
              <div className="text-xs opacity-90">{purpose.title} / {videoLength.title}</div>
              <div className="text-lg font-bold">撮影中：カット {currentCut.cutNo} / {totalCuts}</div>
            </div>
            <div className="text-3xl">{purpose.icon}</div>
          </div>
          <div className="progress-bar-container">
            {template.cuts.map((_, i) => (
              <div key={i} className={`progress-dot ${i < currentCutIndex ? 'completed' : i === currentCutIndex ? 'current' : ''}`} />
            ))}
          </div>
        </div>
      </div>

      <div className="max-w-3xl mx-auto px-4 py-6">

        <div className="cut-info-box fade-in" key={currentCutIndex}>
          <div className="cut-info-number">CUT {currentCut.cutNo} / {totalCuts}</div>
          <div className="flex items-center justify-center gap-2 mb-2">
            <span className="scene-tag">{sceneInfo[currentCut.sceneId].icon} {sceneInfo[currentCut.sceneId].label}</span>
            <span className="text-xs text-stone-500">⏱ {currentCut.duration}秒</span>
          </div>
          <div className="cut-info-instruction">{currentCut.instruction}</div>
        </div>

        <div className="section-card">
          <div className="section-title"><span>💡</span><span>ライティング</span></div>
          {sceneData.lighting.map((b, i) => (<div key={i} className="bullet-item"><span className="bullet-mark">▶</span><span>{b}</span></div>))}
        </div>

        <div className="section-card">
          <div className="section-title"><span>📱</span><span>スマホの構え方</span></div>
          {sceneData.smartphone.map((b, i) => (<div key={i} className="bullet-item"><span className="bullet-mark">▶</span><span>{b}</span></div>))}
        </div>

        <div className="section-card">
          <div className="section-title"><span>✨</span><span>撮影のコツ</span></div>
          {sceneData.tips.map((b, i) => (<div key={i} className="bullet-item"><span className="bullet-mark">▶</span><span>{b}</span></div>))}
        </div>

        <div className="section-card" style={{borderLeftColor: '#E74C3C', background: 'linear-gradient(135deg, #FFF8E7 0%, #FEF5E7 100%)'}}>
          <div className="section-title" style={{color: '#C0392B'}}><span>📹</span><span>このカットを撮影する</span></div>
          <p className="text-sm text-stone-700 mb-4 leading-relaxed">
            準備ができたら、撮影スタートボタンを押してください。<br/>
            チェックリストで最終確認してからカメラが起動します。
          </p>
          <button onClick={handleStartShoot} className="camera-btn-big">
            <span>📹</span>
            <span>CUT {currentCut.cutNo} を撮影する</span>
          </button>
        </div>

        {recordedVideos.length > 0 && (
          <div className="section-card" style={{borderLeftColor: '#27AE60'}}>
            <div className="section-title" style={{color: '#1E8449'}}><span>✅</span><span>撮影済み（{recordedVideos.length}本）</span></div>
            {recordedVideos.map(rv => (
              <div key={rv.cutNo} className="recorded-video-row">
                <video src={rv.url} className="recorded-video-thumb" muted />
                <div className="flex-1 min-w-0">
                  <div className="text-xs font-bold text-green-700">CUT {rv.cutNo} 撮影完了</div>
                  <div className="text-xs text-stone-600 truncate">{rv.cut.instruction}</div>
                </div>
                <div className="text-green-500 text-xl flex-shrink-0">✓</div>
              </div>
            ))}
          </div>
        )}

      </div>

      <input ref={fileInputRef} type="file" accept="video/*" capture="environment" onChange={handleCapture} style={{display: 'none'}} />

      {showChecklist && (
        <ChecklistModal scene={currentCut.sceneId} cut={currentCut} checklistItems={sceneData.checklist} onClose={() => setShowChecklist(false)} onShoot={handleConfirmShoot} />
      )}

      {previewVideoUrl && (
        <PreviewModal videoUrl={previewVideoUrl} cut={currentCut} totalCuts={totalCuts} onRetake={handleRetake} onDone={handleAcceptVideo} />
      )}
    </div>
  );
}

// ========== 完了画面 ==========
function CompletionScreen({ purpose, videoLength, recordedVideos, onBackToTop }) {
  const template = CUT_TEMPLATES[purpose.id][videoLength.seconds];
  const purposeData = PURPOSE_DATA[purpose.id];
  const totalSeconds = template.cuts.reduce((sum, c) => sum + c.duration, 0);
  const [copiedKey, setCopiedKey] = useState(null);

  const copyText = (text, key) => {
    navigator.clipboard.writeText(text).then(() => {
      setCopiedKey(key);
      setTimeout(() => setCopiedKey(null), 2000);
    });
  };

  const openCapCut = () => {
    window.location.href = 'capcut://';
  };

  return (
    <div className="min-h-screen fade-in pb-12">
      <div className="text-white py-10 px-4 relative overflow-hidden text-center" style={{background: 'linear-gradient(135deg, #27AE60 0%, #1E8449 100%)'}}>
        <div className="absolute inset-0 wood-pattern"></div>
        <div className="relative z-10 max-w-2xl mx-auto">
          <div className="text-6xl mb-3 celebration-burst">🎉</div>
          <h1 className="text-2xl md:text-3xl font-bold mb-2">お疲れさまでした！</h1>
          <p className="text-sm opacity-95 mb-3">{recordedVideos.length}カット、すべて撮影完了です</p>
          <div className="inline-block bg-white text-green-700 px-4 py-1 rounded-full text-xs font-bold">
            {purpose.title} / {videoLength.title}版（合計{totalSeconds}秒）
          </div>
        </div>
      </div>

      <div className="max-w-3xl mx-auto px-4 py-6">

        <div className="section-card" style={{borderLeftColor: '#27AE60'}}>
          <div className="section-title" style={{color: '#1E8449'}}><span>📹</span><span>撮影した動画（{recordedVideos.length}本）</span></div>
          <p className="text-xs text-stone-600 mb-3 leading-relaxed">
            動画は端末のカメラロール（写真アプリ）に自動保存されています。<br/>
            下のプレビューで確認できます。
          </p>
          {recordedVideos.map(rv => (
            <div key={rv.cutNo} className="recorded-video-row">
              <video src={rv.url} className="recorded-video-thumb" controls />
              <div className="flex-1 min-w-0">
                <div className="text-xs font-bold text-green-700 mb-1">CUT {rv.cutNo} ✓</div>
                <div className="text-xs text-stone-600 leading-snug">{rv.cut.instruction}</div>
                <div className="text-xs text-stone-400 mt-1">⏱ {rv.cut.duration}秒</div>
              </div>
            </div>
          ))}
        </div>

        <div className="section-card" style={{borderLeftColor: '#8B4513'}}>
          <div className="section-title" style={{color: '#8B4513'}}><span>🎬</span><span>CapCutで仕上げよう</span></div>
          <p className="text-sm text-stone-700 mb-4 leading-relaxed">
            撮影した{recordedVideos.length}本の動画を、CapCutで1つの動画に編集します。
          </p>

          <div className="space-y-2.5 mb-4">
            <div className="flex items-start gap-2.5">
              <div className="step-num-box">1</div>
              <div className="text-sm text-stone-700 leading-relaxed flex-1">CapCutアプリを開いて「+ 新しいプロジェクト」をタップ</div>
            </div>
            <div className="flex items-start gap-2.5">
              <div className="step-num-box">2</div>
              <div className="text-sm text-stone-700 leading-relaxed flex-1">カメラロールから今撮った{recordedVideos.length}本の動画を順番に選択</div>
            </div>
            <div className="flex items-start gap-2.5">
              <div className="step-num-box">3</div>
              <div className="text-sm text-stone-700 leading-relaxed flex-1">CUT 1 → CUT {recordedVideos.length} の順番になっているか確認</div>
            </div>
            <div className="flex items-start gap-2.5">
              <div className="step-num-box">4</div>
              <div className="text-sm text-stone-700 leading-relaxed flex-1">「オーディオ」→「サウンド」から雰囲気に合うBGMを追加<br/><span className="text-xs text-stone-500">おすすめ：{purposeData.bgmMood}</span></div>
            </div>
            <div className="flex items-start gap-2.5">
              <div className="step-num-box">5</div>
              <div className="text-sm text-stone-700 leading-relaxed flex-1">「テキスト」で料理名・価格・店名を追加（大きめのフォントで）</div>
            </div>
            <div className="flex items-start gap-2.5">
              <div className="step-num-box">6</div>
              <div className="text-sm text-stone-700 leading-relaxed flex-1">右上の「書き出し」→ カメラロールに保存 → SNSへ投稿！</div>
            </div>
          </div>

          <button onClick={openCapCut} className="camera-btn-big" style={{background: 'linear-gradient(135deg, #2C2C2E 0%, #1C1C1E 100%)', boxShadow: '0 6px 20px rgba(0, 0, 0, 0.3)'}}>
            <span>📱</span>
            <span>CapCutを開く</span>
          </button>
          <p className="text-xs text-stone-500 mt-3 text-center leading-relaxed">
            ※CapCutアプリがインストールされていない場合は、<br/>
            App Store / Google Playからダウンロードしてください
          </p>
        </div>

        <div className="section-card" style={{borderLeftColor: '#3498DB'}}>
          <div className="section-title" style={{color: '#1F618D'}}><span>📝</span><span>投稿キャプション例</span></div>
          <p className="text-xs text-stone-600 mb-3 leading-relaxed">
            動画書き出し後、SNSに投稿する際のキャプション例です。<br/>
            [ ]部分をお店の情報に書き換えてお使いください。
          </p>

          <div className="mt-2">
            <div className="text-xs font-bold text-pink-700 mb-1">📷 Instagram用</div>
            <div className="caption-box">{purposeData.captions.instagram}</div>
            <button onClick={() => copyText(purposeData.captions.instagram, 'ig')} className={`copy-btn ${copiedKey === 'ig' ? 'copied' : ''}`}>
              {copiedKey === 'ig' ? '✓ コピーしました' : '📋 コピーする'}
            </button>
          </div>

          <div className="mt-4">
            <div className="text-xs font-bold text-stone-700 mb-1">🎵 TikTok用</div>
            <div className="caption-box">{purposeData.captions.tiktok}</div>
            <button onClick={() => copyText(purposeData.captions.tiktok, 'tt')} className={`copy-btn ${copiedKey === 'tt' ? 'copied' : ''}`}>
              {copiedKey === 'tt' ? '✓ コピーしました' : '📋 コピーする'}
            </button>
          </div>

          <div className="mt-4">
            <div className="text-xs font-bold text-green-700 mb-1">💬 LINE公式用</div>
            <div className="caption-box">{purposeData.captions.line}</div>
            <button onClick={() => copyText(purposeData.captions.line, 'ln')} className={`copy-btn ${copiedKey === 'ln' ? 'copied' : ''}`}>
              {copiedKey === 'ln' ? '✓ コピーしました' : '📋 コピーする'}
            </button>
          </div>
        </div>

        <div className="text-center mt-8">
          <button onClick={onBackToTop} className="bg-white border-2 border-orange-300 text-orange-700 font-bold px-8 py-3 rounded-full hover:bg-orange-50 transition">
            🔄 もう一度、別の動画を作る
          </button>
        </div>

        <div className="text-center mt-6 text-xs text-stone-500">
          <p>素敵な動画ができますように🍽✨</p>
        </div>
      </div>
    </div>
  );
}

// ========== App ==========
function App() {
  const [screen, setScreen] = useState('top');
  const [selectedPurpose, setSelectedPurpose] = useState(null);
  const [selectedLength, setSelectedLength] = useState(null);
  const [completedVideos, setCompletedVideos] = useState([]);

  const handleSelectPurpose = (p) => { setSelectedPurpose(p); setScreen('length'); window.scrollTo(0, 0); };
  const handleSelectLength = (vl) => { setSelectedLength(vl); setScreen('cuts'); window.scrollTo(0, 0); };
  const handleStartShoot = () => { setScreen('shooting'); window.scrollTo(0, 0); };
  const handleShootComplete = (videos) => { setCompletedVideos(videos); setScreen('completion'); window.scrollTo(0, 0); };

  const handleBackToTop = () => {
    completedVideos.forEach(v => { if (v.url) URL.revokeObjectURL(v.url); });
    setCompletedVideos([]);
    setSelectedPurpose(null);
    setSelectedLength(null);
    setScreen('top');
    window.scrollTo(0, 0);
  };
  const handleBackToLength = () => { setScreen('length'); window.scrollTo(0, 0); };
  const handleBackToCuts = () => { setScreen('cuts'); window.scrollTo(0, 0); };

  if (screen === 'top') return <TopScreen onSelectPurpose={handleSelectPurpose} />;
  if (screen === 'length') return <VideoLengthScreen purpose={selectedPurpose} onSelectLength={handleSelectLength} onBack={handleBackToTop} />;
  if (screen === 'cuts') return <CutListScreen purpose={selectedPurpose} videoLength={selectedLength} onBack={handleBackToLength} onStartShoot={handleStartShoot} />;
  if (screen === 'shooting') return <ShootingScreen purpose={selectedPurpose} videoLength={selectedLength} onComplete={handleShootComplete} onBack={handleBackToCuts} />;
  if (screen === 'completion') return <CompletionScreen purpose={selectedPurpose} videoLength={selectedLength} recordedVideos={completedVideos} onBackToTop={handleBackToTop} />;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
