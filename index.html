        <div className="absolute inset-0 wood-pattern"></div>
        <div className="max-w-3xl mx-auto relative z-10">
          <button onClick={onBack} className="text-sm bg-white/25 hover:bg-white/40 px-3 py-1 rounded-full mb-3 transition">← 目的を選び直す</button>
          <div className="flex items-center gap-3">
            <div className="text-4xl">{purpose.icon}</div>
            <div>
              <div className="text-xs opacity-90">選んだ目的</div>
              <div className="text-xl font-bold">{purpose.title}</div>
            </div>
          </div>
        </div>
      </div>

      <div className="max-w-3xl mx-auto px-4 py-6">
        <h2 className="text-lg font-bold text-stone-800 mb-4">どんなカットを撮りたい？</h2>

        <div className="mb-6">
          <div className="flex items-center gap-2 mb-3">
            <span className="text-yellow-500 text-lg">⭐</span>
            <span className="text-sm font-bold text-orange-700">この目的におすすめ</span>
          </div>
          <div className="space-y-3">
            {recommendedScenes.map(s => (
              <button key={s.id} onClick={() => onSelectScene(s)} className="warm-shadow w-full bg-gradient-to-r from-orange-50 to-amber-50 border-2 border-orange-300 rounded-2xl p-4 text-left hover:border-orange-500">
                <div className="flex items-center gap-3">
                  <div className="text-3xl">{s.icon}</div>
                  <div className="flex-1">
                    <div className="font-bold text-stone-800">{s.title}</div>
                    <div className="text-xs text-stone-600 mt-1">{s.description}</div>
                  </div>
                  <div className="text-orange-500 text-xl">›</div>
                </div>
              </button>
            ))}
          </div>
        </div>

        <div>
          <div className="text-sm font-bold text-stone-500 mb-3">その他のシーンも見る</div>
          <div className="space-y-3">
            {otherScenes.map(s => (
              <button key={s.id} onClick={() => onSelectScene(s)} className="w-full bg-white border border-stone-200 rounded-2xl p-4 text-left hover:border-orange-300 transition">
                <div className="flex items-center gap-3">
                  <div className="text-3xl opacity-80">{s.icon}</div>
                  <div className="flex-1">
                    <div className="font-bold text-stone-700">{s.title}</div>
                    <div className="text-xs text-stone-500 mt-1">{s.description}</div>
                  </div>
                  <div className="text-stone-300 text-xl">›</div>
                </div>
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function GuideScreen({ purpose, scene, onBack }) {
  const guide = getGuideContent(purpose.id, scene.id);
  const [copiedKey, setCopiedKey] = useState(null);

  const copyText = (text, key) => {
    navigator.clipboard.writeText(text).then(() => {
      setCopiedKey(key);
      setTimeout(() => setCopiedKey(null), 2000);
    });
  };

  return (
    <div className="min-h-screen fade-in pb-12">
      <div className="text-white py-5 px-4 relative overflow-hidden sticky top-0 z-20" style={{background: 'linear-gradient(135deg, #E67E22 0%, #F39C12 100%)'}}>
        <div className="absolute inset-0 wood-pattern"></div>
        <div className="max-w-3xl mx-auto relative z-10">
          <button onClick={onBack} className="text-sm bg-white/25 hover:bg-white/40 px-3 py-1 rounded-full mb-3 transition">← シーンを選び直す</button>
          <div className="flex items-center gap-2">
            <div className="text-3xl">{purpose.icon}</div>
            <div className="text-xl opacity-80">×</div>
            <div className="text-3xl">{scene.icon}</div>
          </div>
          <div className="mt-2 text-sm font-bold">{purpose.title} × {scene.title}</div>
        </div>
      </div>

      <div className="max-w-3xl mx-auto px-4 py-6">

        <div className="section-card">
          <div className="section-title"><span>📐</span><span>撮影の基本</span></div>
          {guide.basics.map((b, i) => (
            <div key={i} className="bullet-item"><span className="bullet-mark">▶</span><span>{b}</span></div>
          ))}
        </div>

        <div className="section-card">
          <div className="section-title"><span>💡</span><span>{scene.title}のライティング</span></div>
          {guide.lighting.map((b, i) => (
            <div key={i} className="bullet-item"><span className="bullet-mark">▶</span><span>{b}</span></div>
          ))}
        </div>

        <div className="section-card">
          <div className="section-title"><span>📱</span><span>スマホの構え方・角度</span></div>
          {guide.smartphone.map((b, i) => (
            <div key={i} className="bullet-item"><span className="bullet-mark">▶</span><span>{b}</span></div>
          ))}
        </div>

        <div className="section-card">
          <div className="section-title"><span>✨</span><span>{scene.title}のコツ</span></div>
          {guide.tips.map((b, i) => (
            <div key={i} className="bullet-item"><span className="bullet-mark">▶</span><span>{b}</span></div>
          ))}
        </div>

        <div className="section-card" style={{borderLeftColor: '#F4D03F'}}>
          <div className="section-title" style={{color: '#B7950B'}}><span>🍽</span><span>飲食店ならではのコツ</span></div>
          {guide.restaurantTips.map((b, i) => (
            <div key={i} className="bullet-item"><span className="bullet-mark" style={{color: '#F4D03F'}}>▶</span><span>{b}</span></div>
          ))}
        </div>

        <div className="section-card" style={{borderLeftColor: '#E74C3C'}}>
          <div className="section-title" style={{color: '#C0392B'}}><span>⚠</span><span>やりがちなNG例</span></div>
          {guide.ngExamples.map((b, i) => (
            <div key={i} className="bullet-item"><span className="bullet-mark" style={{color: '#E74C3C'}}>✗</span><span>{b}</span></div>
          ))}
        </div>

        <div className="section-card" style={{borderLeftColor: '#8B4513'}}>
          <div className="section-title" style={{color: '#8B4513'}}><span>🎬</span><span>CapCut編集の3ステップ</span></div>
          {guide.capcutSteps.map((s, i) => (
            <div key={i} className="mb-3 last:mb-0">
              <div className="flex items-center gap-2 mb-1">
                <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-0.5 rounded">{s.step}</span>
                <span className="font-bold text-stone-800 text-sm">{s.title}</span>
              </div>
              <div className="text-xs text-stone-600 leading-relaxed pl-1">{s.detail}</div>
            </div>
          ))}
        </div>

        <div className="section-card" style={{borderLeftColor: '#9B59B6'}}>
          <div className="section-title" style={{color: '#7D3C98'}}><span>📅</span><span>投稿のベストタイミング</span></div>
          <div className="text-sm leading-relaxed text-stone-700">{guide.timing}</div>
        </div>

        <div className="section-card" style={{borderLeftColor: '#16A085'}}>
          <div className="section-title" style={{color: '#117864'}}><span>🎵</span><span>BGMの雰囲気</span></div>
          <div className="text-sm leading-relaxed text-stone-700 mb-2">{guide.bgmMood}</div>
          <div className="text-xs text-stone-500 leading-relaxed">※CapCutの無料BGMから雰囲気の合うものを選びましょう</div>
        </div>

        <div className="section-card" style={{borderLeftColor: '#3498DB'}}>
          <div className="section-title" style={{color: '#1F618D'}}><span>📝</span><span>投稿キャプション例</span></div>

          <div className="mt-2">
            <div className="text-xs font-bold text-pink-700 mb-1">📷 Instagram用</div>
            <div className="caption-box">{guide.captions.instagram}</div>
            <button onClick={() => copyText(guide.captions.instagram, 'ig')} className={`copy-btn ${copiedKey === 'ig' ? 'copied' : ''}`}>
              {copiedKey === 'ig' ? '✓ コピーしました' : '📋 コピーする'}
            </button>
          </div>

          <div className="mt-4">
            <div className="text-xs font-bold text-stone-700 mb-1">🎵 TikTok用</div>
            <div className="caption-box">{guide.captions.tiktok}</div>
            <button onClick={() => copyText(guide.captions.tiktok, 'tt')} className={`copy-btn ${copiedKey === 'tt' ? 'copied' : ''}`}>
              {copiedKey === 'tt' ? '✓ コピーしました' : '📋 コピーする'}
            </button>
          </div>

          <div className="mt-4">
            <div className="text-xs font-bold text-green-700 mb-1">💬 LINE公式用</div>
            <div className="caption-box">{guide.captions.line}</div>
            <button onClick={() => copyText(guide.captions.line, 'ln')} className={`copy-btn ${copiedKey === 'ln' ? 'copied' : ''}`}>
              {copiedKey === 'ln' ? '✓ コピーしました' : '📋 コピーする'}
            </button>
          </div>

          <div className="mt-4 text-xs text-stone-500 leading-relaxed bg-amber-50 p-3 rounded-lg">
            💡 [料理名][価格][店名]などの[ ]部分を、お店の情報に書き換えてお使いください
          </div>
        </div>

        <div className="text-center mt-8">
          <button onClick={onBack} className="bg-white border-2 border-orange-300 text-orange-700 font-bold px-6 py-2 rounded-full hover:bg-orange-50 transition">
            別のシーンも見る
          </button>
        </div>

      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState('top');
  const [selectedPurpose, setSelectedPurpose] = useState(null);
  const [selectedScene, setSelectedScene] = useState(null);

  const handleSelectPurpose = (p) => {
    setSelectedPurpose(p);
    setScreen('scene');
    window.scrollTo(0, 0);
  };

  const handleSelectScene = (s) => {
    setSelectedScene(s);
    setScreen('guide');
    window.scrollTo(0, 0);
  };

  const handleBackToTop = () => { setScreen('top'); window.scrollTo(0, 0); };
  const handleBackToScene = () => { setScreen('scene'); window.scrollTo(0, 0); };

  if (screen === 'top') return <TopScreen onSelectPurpose={handleSelectPurpose} />;
  if (screen === 'scene') return <SceneScreen purpose={selectedPurpose} onSelectScene={handleSelectScene} onBack={handleBackToTop} />;
  if (screen === 'guide') return <GuideScreen purpose={selectedPurpose} scene={selectedScene} onBack={handleBackToScene} />;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
